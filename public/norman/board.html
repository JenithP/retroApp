<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>노만의 공방 — 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="css/norman.css">
<style>
  body{overflow:auto}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 70px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;
    gap:18px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-family:var(--serif);font-size:1.5rem;margin:2px 0 4px}
  .keybar{display:flex;gap:8px;align-items:center}
  .keybar input{background:#12100E;border:1px solid var(--line);color:var(--ui);
    border-radius:5px;padding:9px 11px;font-family:var(--sans);font-size:.85rem;width:170px}
  button{font-family:var(--sans);font-size:.85rem;font-weight:500;color:#1A1409;
    background:var(--ok);border:0;border-radius:6px;padding:10px 15px;cursor:pointer}
  button.ghost{background:var(--panel-2);color:var(--ui);border:1px solid var(--line)}
  button.warn{background:var(--bad);color:#FFF}
  button:disabled{background:var(--panel-2);color:#5E564E;cursor:default}

  .strip{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
  .stat{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:11px 14px}
  .stat b{display:block;font-family:var(--serif);font-size:1.35rem;color:var(--lamp)}
  .stat span{font-size:.74rem;color:var(--ui-soft)}

  table{width:100%;border-collapse:collapse;margin-top:14px;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    overflow:hidden;font-size:.82rem}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:var(--panel-2);color:var(--ui-soft);font-weight:400;font-size:.76rem;
    position:sticky;top:0;z-index:2}
  tbody tr:last-child td{border-bottom:0}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  td.team{font-family:var(--serif);font-size:1rem;color:var(--lamp)}
  tr.idle td{color:#5E564E}
  tr.idle td.team{color:#5E564E}
  .bar{display:inline-block;height:6px;border-radius:3px;background:var(--ok);
    vertical-align:middle;min-width:2px}
  .barwrap{display:flex;align-items:center;gap:7px}
  .drop{color:var(--ok)}.rise{color:var(--bad)}
  .job{color:var(--ui-soft);font-size:.78rem}
  .said{margin:14px 0 0;font-size:.82rem;line-height:1.6;padding:10px 12px;
    border-radius:6px;border-left:3px solid var(--line);background:var(--panel-2)}
  .said.ok{border-left-color:var(--ok);color:#CFE0C4}
  .said.bad{border-left-color:var(--bad);color:#E6C0B9}
  .wipe{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:14px;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:11px 14px}
  .wipe > span{font-size:.84rem;color:var(--ui)}
  .wipe input{background:#12100E;border:1px solid var(--line);color:var(--ui);
    border-radius:5px;padding:8px 10px;font-family:var(--sans);font-size:.82rem;width:92px}
  .wipe em{font-style:normal;font-size:.74rem;color:#6E655C;flex:1;min-width:240px;
    line-height:1.6}
  #keybox{margin-top:26px}
  #keybox[hidden]{display:none!important}
  .keytop{display:flex;align-items:baseline;justify-content:space-between;
    gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:9px}
  .keytop h2{font-family:var(--serif);font-size:1.15rem;margin:0}
  .keytop h2 small{font-family:var(--sans);font-size:.74rem;color:var(--bad);
    font-weight:400;margin-left:8px}
  #keyfind{background:#12100E;border:1px solid var(--line);color:var(--ui);
    border-radius:5px;padding:8px 11px;font-family:var(--sans);font-size:.82rem;width:220px}
  .kjob{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:13px 15px;margin-top:10px}
  .kjob > h3{font-family:var(--serif);font-size:.98rem;margin:0 0 3px;color:var(--lamp)}
  .kjob .ktask{margin:0 0 2px;font-size:.82rem;color:var(--ui)}
  .kjob .ksay{margin:0 0 10px;font-size:.78rem;color:var(--ui-soft)}
  .kpart{border-left:2px solid var(--line);padding:2px 0 2px 11px;margin:9px 0 0}
  .kpart.path{border-left-color:var(--ok)}
  .kpart.decoy{border-left-color:var(--bad)}
  .kpart > b{font-size:.82rem;color:var(--ui)}
  .kpart > b em{font-style:normal;font-size:.7rem;color:var(--ui-soft);margin-left:6px}
  .kgap{margin:5px 0 0;font-size:.76rem;line-height:1.7}
  .kgap > span{color:var(--lamp)}
  .kgap i{font-style:normal;color:var(--ui-soft)}
  .kfree{margin:4px 0 0;font-size:.76rem;color:var(--ui-soft)}
  .ksum{margin:10px 0 0;font-size:.76rem;color:var(--ui-soft);
    border-top:1px solid var(--line);padding-top:8px}
  .ksum b{color:var(--ok)}
  .kgap b{color:var(--ok);font-weight:500}
  .kgap b i{color:#8FA98A}
  .ended{background:#3A2418;border:1px solid #6B4A2E;color:#F0C89A;
    border-radius:8px;padding:12px 15px;margin:16px 0 0;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <p class="oeyebrow">HCI와 커뮤니케이션 · 4주차</p>
      <h1>노만의 공방 <span style="font-family:var(--sans);font-size:.85rem;color:var(--ui-soft)">현황판</span></h1>
    </div>
    <div class="keybar">
      <input id="key" type="password" placeholder="교수용 암호" autocomplete="off">
      <button id="look">보기</button>
      <button id="auto" class="ghost">자동 새로고침 끔</button>
    </div>
  </div>

  <div class="strip" id="strip" hidden></div>
  <div id="endbox" hidden></div>
  <p id="said" class="said" hidden></p>

  <table id="tbl" hidden>
    <thead><tr>
      <th style="width:52px">조</th>
      <th>지금 맡은 주문서</th>
      <th class="n" style="width:78px">포인트</th>
      <th class="n" style="width:70px">만든 앱</th>
      <th class="n" style="width:88px">번 포인트</th>
      <th class="n" style="width:92px">시그니파이어</th>
      <th class="n" style="width:66px">재료</th>
      <th class="n" style="width:74px">만든 단서</th>
      <th class="n" style="width:74px">문제</th>
      <th class="n" style="width:66px">테스트</th>
      <th style="width:190px">막힌 횟수 — 처음 → 마지막</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <div style="margin-top:20px;display:flex;gap:9px;flex-wrap:wrap">
    <button id="end" class="warn" disabled>조별 활동 종료</button>
    <button id="open" class="ghost" disabled>다시 열기</button>
    <button id="keybtn" class="ghost" disabled>정답표 보기</button>
  </div>

  <!-- 지갑 되돌리기 — 전에는 /norman/admin.html 에 따로 있었다.
       암호를 두 번 넣을 까닭이 없어 여기로 옮겼다. -->
  <div class="wipe">
    <span>지갑 되돌리기</span>
    <input id="one" type="number" min="1" max="20" placeholder="조 번호">
    <button id="onebtn" class="ghost" disabled>이 조만</button>
    <button id="allbtn" class="warn" disabled>스무 조 전부</button>
    <em>포인트 · 재료 · 만든 단서 · 붙인 것 · 판 기록이 지워지고 1000P로 다시 시작합니다.
      장부는 남습니다.</em>
  </div>

  <!-- 마흔 개 의뢰의 정답. 암호를 넣고 「보기」를 누른 뒤에 열린다. -->
  <section id="keybox" hidden>
    <div class="keytop">
      <h2>정답표 <small>학생에게 힌트를 줄 때만 쓰십시오</small></h2>
      <input id="keyfind" placeholder="앱·화면 이름으로 찾기" autocomplete="off">
    </div>
    <div id="keylist"></div>
  </section>
</div>

<script type="module">
import { JOBS } from "./js/jobs.js";
import { RECIPES, MATERIALS, mat } from "./js/parts.js";
import { needOf, givesOf, bucketOf, GAPNAME } from "./js/kit.js";
const jobName = id => {
  const j = JOBS.find(x => x.id === id);
  return j ? j.app + " " + j.screen : id;
};

const $ = id => document.getElementById(id);
const said = $("said");
let ticker = 0, ended = false;

function tell(text, ok) {
  said.hidden = false;
  said.className = "said " + (ok ? "ok" : "bad");
  said.textContent = text;
}

async function call(op) {
  const key = $("key").value.trim();
  if (!key) { tell("암호를 먼저 적어 주세요.", false); return null; }
  const r = await fetch("/api/deal", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ op: op, key: key }),
  });
  const j = await r.json().catch(() => ({ error: "응답을 읽지 못했습니다" }));
  if (!r.ok) { tell(j.error || "불러오지 못했습니다.", false); return null; }
  return j;
}

/* ── 그리기 ───────────────────────────────────────────────── */

function bar(n, most) {
  const w = most > 0 ? Math.round((n / most) * 60) : 0;
  return '<span class="barwrap"><span class="bar" style="width:' + w +
    'px"></span>' + n + "</span>";
}

function stuckCell(r) {
  if (!r.first) return '<span class="job">테스트 전</span>';
  const a = r.first.exec, b = r.last.exec;
  const arrow = b < a ? "drop" : (b > a ? "rise" : "");
  return a + " &rarr; <b class=\"" + arrow + "\">" + b + "</b>" +
    ' <span class="job">(' + r.runs + "번)</span>";
}

function paint(j) {
  const rows = j.rows || [];
  ended = !!(j.session && j.session.ended);

  const live = rows.filter(r => r.point !== 1000 || r.runs || r.done);
  const mostPoint = Math.max(1, ...rows.map(r => r.point));

  $("strip").hidden = false;
  $("strip").innerHTML = [
    ["들어온 조", rows.length + " / 20"],
    ["움직인 조", live.length + "조"],
    ["만든 앱", rows.reduce((a, r) => a + r.done, 0) + "개"],
    ["완성한 시그니파이어", rows.reduce((a, r) => a + r.worn, 0) + "개"],
    ["맞힌 문제", rows.reduce((a, r) => a + r.quiz, 0) + "개"],
    ["가장 많이 번 조", (() => {
      const top = rows.slice().sort((a, b) => b.point - a.point)[0];
      return top ? top.team + "조 · " + top.point : "—";
    })()],
  ].map(s => '<div class="stat"><b>' + s[1] + "</b><span>" + s[0] +
    "</span></div>").join("");

  $("tbl").hidden = false;
  $("rows").innerHTML = rows.map(function (r) {
    const quiet = !r.runs && !r.done && r.point === 1000 && !r.worn;
    return '<tr class="' + (quiet ? "idle" : "") + '">' +
      '<td class="team">' + r.team + "</td>" +
      '<td class="job">' + (r.job ? jobName(r.job) : "—") + "</td>" +
      '<td class="n">' + bar(r.point, mostPoint) + "</td>" +
      '<td class="n">' + r.done + "</td>" +
      '<td class="n">' + r.sold + "</td>" +
      '<td class="n">' + r.worn + "</td>" +
      '<td class="n">' + r.mats + "</td>" +
      '<td class="n">' + r.tools + "</td>" +
      '<td class="n">' + r.quiz + "</td>" +
      '<td class="n">' + r.runs + "</td>" +
      "<td>" + stuckCell(r) + "</td>" +
      "</tr>";
  }).join("");

  $("keybtn").disabled = false;
  $("onebtn").disabled = false;
  $("allbtn").disabled = false;
  $("end").disabled = ended;
  $("open").disabled = !ended;
  $("endbox").hidden = !ended;
  if (ended) $("endbox").innerHTML =
    '<p class="ended"><b>활동이 닫혀 있습니다.</b> 조의 포인트는 움직이지 않고, ' +
    "학생 화면에는 실습보고서 내려받기가 떠 있습니다.</p>";
}

async function look(quiet) {
  const j = await call("board");
  if (!j) return;
  paint(j);
  if (!quiet) tell("불러왔습니다. " + new Date().toLocaleTimeString("ko-KR"), true);
}

/* ── 버튼 ─────────────────────────────────────────────────── */

/* ── 정답표 ───────────────────────────────────────────────────
   무엇이 모자라고, 무엇을 합치면 그것이 되는지. 조가 막혔을 때
   한 걸음만 짚어 주기 위한 것이다. 화면에 띄워 두지 마십시오. */

const cost = r => (mat(r.a).price || 0) + (mat(r.b).price || 0);

/** 이 자리에 이 기준을 채울 수 있는 단서들 — 싼 것부터 */
function ways(part, gap) {
  return RECIPES
    .filter(r => givesOf(r.id).includes(gap) && r.on.includes(bucketOf(part.kind)))
    .sort((a, b) => cost(a) - cost(b));
}

/** 이 자리를 가장 싸게 채우는 길.
 *  기준마다 제일 싼 것을 하나씩 고르면 셈이 커진다 — 「글자 버튼」처럼
 *  하나로 둘을 채우는 단서가 있기 때문이다. 다 따져 본다.            */
function cheapest(part) {
  const gaps = part.decoy ? [] : needOf(part);
  if (!gaps.length) return { sum: 0, pick: [] };
  const pool = RECIPES.filter(r => r.on.includes(bucketOf(part.kind)) &&
    givesOf(r.id).some(g => gaps.includes(g)));
  let best = null;
  const walk = (i, left, chosen, sum) => {
    if (!left.length) {
      if (!best || sum < best.sum) best = { sum: sum, pick: chosen.slice() };
      return;
    }
    if (i >= pool.length || (best && sum >= best.sum)) return;
    const r = pool[i];
    if (givesOf(r.id).some(g => left.includes(g))) {
      chosen.push(r);
      walk(i + 1, left.filter(g => !givesOf(r.id).includes(g)), chosen, sum + cost(r));
      chosen.pop();
    }
    walk(i + 1, left, chosen, sum);
  };
  walk(0, gaps, [], 0);
  return best || { sum: 0, pick: [] };
}

function keyHTML() {
  return JOBS.map((job, i) => {
    const onPath = {};
    job.steps.forEach(s => { onPath[s.part] = true; });
    let least = 0;

    const parts = job.parts.map(p => {
      const gaps = p.decoy ? [] : needOf(p);
      const cls = p.decoy ? "decoy" : (onPath[p.id] ? "path" : "");
      const tag = p.decoy ? "미끼 — 아무것도 붙이지 마십시오"
                : onPath[p.id] ? "과제 경로 — 여기가 막히면 못 팝니다"
                : "곁가지 — 채우면 값이 오릅니다";
      if (!gaps.length) {
        return '<div class="kpart ' + cls + '"><b>' + (p.label || p.id) +
          "<em>" + tag + "</em></b>" +
          '<p class="kfree">채울 것이 없습니다.</p></div>';
      }
      const short = cheapest(p);
      if (onPath[p.id]) least += short.sum;
      const shortIds = short.pick.map(r => r.id);

      const lines = gaps.map(g => {
        const opts = ways(p, g);
        return '<p class="kgap"><span>' + (GAPNAME[g] || g) + "</span><br>" +
          opts.map(r => {
            const two = givesOf(r.id).filter(x => gaps.includes(x));
            return (shortIds.includes(r.id) ? "<b>· " : "· ") + r.name +
              " <i>= " + mat(r.a).name + " + " + mat(r.b).name + " · " + cost(r) + "P" +
              (two.length > 1 ? " · 이 하나로 " + two.length + "가지를 채웁니다" : "") +
              "</i>" + (shortIds.includes(r.id) ? "</b>" : "");
          }).join("<br>") + "</p>";
      }).join("");
      return '<div class="kpart ' + cls + '"><b>' + (p.label || p.id) +
        "<em>" + tag + "</em></b>" + lines +
        (short.pick.length > 1
          ? '<p class="kfree">가장 싸게 — ' + short.pick.map(r => r.name).join(" + ") +
            " · " + short.sum + "P</p>"
          : "") + "</div>";
    }).join("");

    return '<div class="kjob" data-find="' + (job.app + " " + job.screen + " " + job.id) +
      '"><h3>' + (i + 1) + ". " + job.app + " " + job.screen + "</h3>" +
      '<p class="ktask">' + job.task + "</p>" +
      '<p class="ksay">사용자 말 — 「' + job.say + "」</p>" +
      parts +
      '<p class="ksum">과제 경로를 가장 싸게 채우면 재료값 <b>' + least +
      "P</b> · 팔면 140~200P</p></div>";
  }).join("");
}

let keyDrawn = false;
$("keybtn").addEventListener("click", function () {
  const box = $("keybox");
  if (!keyDrawn) { $("keylist").innerHTML = keyHTML(); keyDrawn = true; }
  box.hidden = !box.hidden;
  this.textContent = box.hidden ? "정답표 보기" : "정답표 덮기";
  if (!box.hidden) box.scrollIntoView({ behavior: "smooth", block: "start" });
});

/** 지갑 되돌리기 — 서버의 reset 을 부른다. 장부는 건드리지 않는다. */
async function wipe(team, btn) {
  const key = $("key").value.trim();
  if (!key) return tell("암호를 먼저 적어 주세요.", false);
  btn.disabled = true;
  try {
    const body = { op: "reset", key: key };
    if (team) body.team = team;
    const r = await fetch("/api/deal", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({ error: "응답을 읽지 못했습니다" }));
    if (!r.ok) return tell(j.error || "되돌리지 못했습니다.", false);
    const n = (j["되돌린조"] || []).length;
    tell(n === 1 ? j["되돌린조"][0] + "조를 새 지갑으로 되돌렸습니다."
                 : n + "개 조를 전부 새 지갑으로 되돌렸습니다.", true);
    look(true);
  } catch (e) {
    tell("서버에 닿지 못했습니다. " + (e.message || e), false);
  } finally {
    btn.disabled = false;
  }
}

$("onebtn").addEventListener("click", function () {
  const n = Number($("one").value);
  if (!(n >= 1 && n <= 20)) return tell("조 번호를 1에서 20 사이로 적어 주세요.", false);
  if (!confirm(n + "조의 지갑을 되돌립니다. 되살릴 수 없습니다.")) return;
  wipe(n, this);
});

$("allbtn").addEventListener("click", function () {
  if (!confirm("스무 조의 지갑을 전부 되돌립니다.
되살릴 수 없습니다. 계속할까요?")) return;
  wipe(null, this);
});

$("keyfind").addEventListener("input", function () {
  const q = this.value.trim();
  $("keylist").querySelectorAll(".kjob").forEach(function (n) {
    n.hidden = !!q && n.dataset.find.indexOf(q) < 0;
  });
});

$("look").addEventListener("click", () => look(false));
$("key").addEventListener("keydown", e => { if (e.key === "Enter") look(false); });

$("auto").addEventListener("click", function () {
  if (ticker) {
    clearInterval(ticker); ticker = 0;
    this.textContent = "자동 새로고침 끔"; this.classList.add("ghost");
  } else {
    ticker = setInterval(() => look(true), 20000);
    this.textContent = "자동 새로고침 켬 (20초)"; this.classList.remove("ghost");
    look(true);
  }
});

$("end").addEventListener("click", async function () {
  if (!confirm("스무 조의 활동을 닫습니다.\n\n포인트가 멈추고, 학생 화면에 " +
    "실습보고서 내려받기가 뜹니다.\n기록은 지워지지 않으며 다시 열 수 있습니다."))
    return;
  this.disabled = true;
  const j = await call("end");
  if (j) { tell("활동을 닫았습니다. 학생들이 실습보고서를 내려받을 수 있습니다.", true); }
  look(true);
});

$("open").addEventListener("click", async function () {
  this.disabled = true;
  const j = await call("open");
  if (j) tell("활동을 다시 열었습니다.", true);
  look(true);
});
</script>
</body>
</html>
