<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>노만의 공방 — HCI와 커뮤니케이션 4주차 실습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="css/norman.css">
<link rel="stylesheet" href="css/craft.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/card.css">
</head>
<body>

<!-- ══ 들머리 · 조 고르기 ══════════════════════════════════ -->
<section id="gate">
  <div class="gatecard">
    <p class="oeyebrow">HCI와 커뮤니케이션 · 4주차 오프라인</p>
    <h1>노만의 공방</h1>
    <p class="glead">
      여러분은 앱 화면을 고쳐 파는 장인입니다. 주문으로 들어온 화면은
      <b>이미 다 작동합니다.</b> 다만 무엇을 할 수 있는지 알려 주지 않아 아무도 쓰지 못합니다.
      기능은 손대지 못합니다. 여러분이 붙일 수 있는 것은 <b>단서</b>뿐입니다.
    </p>

    <p class="glabel">조를 고르십시오</p>
    <div class="teamgrid" id="teamgrid"></div>

    <div class="orderpeek" id="orderpeek" hidden></div>
    <button class="big" id="enter" disabled>공방 문을 연다</button>
    <p class="gtip" id="gtip">한 조가 피시 여러 대로 들어와도 같은 공방입니다 &mdash;
      한 대에서 산 재료가 나머지 대에도 그대로 보입니다.</p>
  </div>
</section>

<header id="bar" hidden>
  <div class="who">
    <span class="brand">노만의 공방</span>
    <span class="teamtag" id="teamtag"></span>
    <span class="whoami" id="whoami"></span>
  </div>
  <nav class="places" id="places">
    <button class="place on" data-go="bench">공방</button>
    <button class="place" data-go="shop">상점</button>
    <button class="place" data-go="market">앱시장</button>
    <button class="place" data-go="quiz">문제 풀기</button>
  </nav>
  <div class="right">
    <span class="coin" id="coin">1000</span>
    <span id="netdot" class="dot" title="연결 상태"></span>
    <span class="netmsg" id="netmsg">연결 중</span>
    <button class="flag" id="cold" title="이 화면을 처음 보는 사용자가 어디서 막히는지 확인한다">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1v14M3 2h9l-2 3 2 3H3z"/></svg>
      테스트해 보기
    </button>
    <button class="flag ghost" id="arrange" aria-pressed="false" title="화면 요소의 순서를 바꾸고 묶는다">자리 옮기기</button>
    <button class="flag ghost" id="before" aria-pressed="false" title="단서를 붙이기 전 화면과 비교한다">원래 화면</button>
    <button class="flag ghost" id="reset" title="화면에 입력한 값과 테스트 결과를 지운다. 포인트와 붙인 단서는 그대로다">화면 비우기</button>
    <button class="flag ghost" id="swap" title="다른 조로 들어간다">조 바꾸기</button>
  </div>
</header>

<main id="bench" hidden>

  <!-- ══ 가운데 · 작업대 ═════════════════════════════════════ -->
  <section class="stage" aria-label="작업대">
    <div class="bench" aria-hidden="true"></div>
    <div class="lamp" aria-hidden="true"></div>

    <!-- 공방을 세운 사람. 조언할 때 액자가 빛난다. -->
    <button class="portrait" id="portrait" title="노만 영감에게 묻는다 — 문제를 맞히면 포인트를 준다">
      <span class="frame"><img src="img/norman.webp" alt="노만 영감의 초상화"></span>
      <span class="plate">노만 영감</span>
      <span class="ping" id="portping" hidden>?</span>
    </button>

    <!-- 왼쪽 선반 — 앱시장에 내놓은 화면이 쌓인다 -->
    <aside class="shelf" id="shelf" hidden></aside>

    <div class="order" id="order"></div>

    <div class="phonewrap">
      <div class="phone" id="phone">
        <div class="statusbar"><span>9:41</span><span class="bars"></span></div>
        <div class="screen" id="screen"></div>
        <div class="toast" id="toast" hidden></div>
        <div class="checkfx" id="checkfx" hidden>
          <svg viewBox="0 0 48 48"><path d="M10 25l9 9 19-21"/></svg>
        </div>
      </div>
      <p class="phonenote" id="phonenote">
        이 화면은 <b>이미 다 작동합니다.</b> 무엇을 할 수 있는지 알려 주지 않을 뿐입니다.
      </p>
    </div>

    <div class="talk" id="talk" hidden></div>
    <div class="verdict" id="verdict" hidden></div>
  </section>

  <!-- ══ 오른쪽 · 제작대 ═══════════════════════════════════ -->
  <section class="scripts" id="craft" aria-label="제작대"></section>

</main>

<section id="shop" class="place-view" hidden></section>
<section id="market" class="place-view" hidden></section>
<section id="quiz" class="place-view" hidden></section>

<div class="drag" id="drag" hidden></div>

<script type="module" src="js/main.js"></script>
<!-- 활동이 끝나면 덮는다. 교수가 현황판에서 종료를 누를 때만 뜬다. -->
<div id="closing" hidden></div>

</body>
</html>
