<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>신기술 인터페이스 체험 실습 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="../appshop/css/appshop.css">
<link rel="stylesheet" href="../appshop/css/board.css">
<link rel="stylesheet" href="css/newtech.css">
</head>
<body class="board">

<header class="top">
  <div class="brand">
    <p class="eyebrow">HCI와 커뮤니케이션 · 7주차 오프라인</p>
    <h1>신기술 인터페이스 체험 실습 <span class="sub">현황판</span></h1>
  </div>
  <div class="status">
    <span class="chip phase" id="phaseChip">연결 중</span>
    <span class="net"><span class="dot" id="netdot"></span><span id="netmsg">연결 중…</span></span>
  </div>
</header>

<section class="control">
  <div class="lock" id="lock">
    <label>교수용 암호 <input id="code" type="password" autocomplete="off"></label>
    <button class="btn primary" id="unlock">열기</button>
    <span class="msg" id="lockMsg"></span>
  </div>
  <div class="steps" id="steps" hidden>
    <button class="btn step" data-phase="ready">① 안내</button>
    <button class="btn step" data-phase="r1">② 1차 체험</button>
    <button class="btn step publish" data-phase="check">③ 확인 과제</button>
    <button class="btn step" data-phase="r2">④ 2차 체험 · 설계</button>
    <button class="btn step publish" data-phase="reveal">⑤ 결과 공개</button>
    <button class="btn step" data-phase="opinion">⑥ 조별 의견</button>
    <button class="btn step" data-phase="end">⑦ 종료</button>
    <button class="btn ghost danger" id="reset" type="button">전체 초기화</button>
    <span class="msg" id="stepMsg"></span>
  </div>
</section>

<section class="kpis" id="kpis" aria-label="요약"></section>

<main class="bgrid">
  <section class="panel">
    <h2>유형별 결과 <small>가 1 · 4 · 7 …조 / 나 2 · 5 · 8 …조 / 다 3 · 6 · 9 …조</small></h2>
    <div id="results"></div>
    <h2>문항별 정답률 <small>개념 · 체험 구분</small></h2>
    <div id="items"></div>
  </section>
  <section class="panel side">
    <h2>조별 진행 <small>카드 선택 시 우리 집 규칙 · 조별 의견</small></h2>
    <div class="teamgrid" id="teams"></div>
    <h2>조별 의견 <small>의견 단계 이후</small></h2>
    <div id="opinions"></div>
  </section>
</main>

<dialog id="detail">
  <div class="dhead"><h2 id="dTitle"></h2><button class="btn ghost" id="dClose">닫기</button></div>
  <div class="dbody" id="dBody"></div>
</dialog>

<script type="module" src="js/board.js"></script>
</body>
</html>
