<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VR · AR 적용 판단 실습 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="../appshop/css/appshop.css">
<link rel="stylesheet" href="../appshop/css/board.css">
<link rel="stylesheet" href="css/vrcard.css">
</head>
<body class="board">

<header class="top">
  <div class="brand">
    <p class="eyebrow">HCI와 커뮤니케이션 · 6주차 오프라인</p>
    <h1>VR · AR 적용 판단 실습 <span class="sub">현황판</span></h1>
  </div>
  <div class="status">
    <span class="chip phase" id="phaseChip">연결 중</span>
    <span class="net"><span class="dot" id="netdot"></span><span id="netmsg">연결 중…</span></span>
  </div>
</header>

<section class="control">
  <div class="lock" id="lock">
    <label>교수용 암호 <input id="code" type="password" autocomplete="off"></label>
    <button class="btn primary" id="unlock">열기</button>
    <span class="msg" id="lockMsg"></span>
  </div>
  <div class="steps" id="steps" hidden>
    <button class="btn step" data-phase="ready">① 안내</button>
    <button class="btn step" data-phase="sort">② 분류 시작</button>
    <button class="btn step publish" data-phase="share">③ 공유 (분류 잠금)</button>
    <button class="btn step" data-phase="design">④ 재설계</button>
    <button class="btn step publish" data-phase="side">⑤ 부작용 검토</button>
    <button class="btn step" data-phase="reply">⑥ 대응책</button>
    <button class="btn step" data-phase="end">⑦ 종료</button>
    <button class="btn ghost danger" id="reset" type="button">전체 초기화</button>
    <span class="msg" id="stepMsg"></span>
  </div>
</section>

<section class="kpis" id="kpis" aria-label="요약"></section>

<main class="bgrid">
  <section class="panel">
    <h2>반 전체 분류 결과 <small>카드별 조 배치 현황 · 줄 선택 시 조별 근거</small>
      <span class="seg2"><button class="btn on" data-o="split" type="button">불일치 순</button><button class="btn" data-o="id" type="button">번호 순</button></span></h2>
    <div class="compare" id="compare"></div>
  </section>
  <section class="panel side">
    <h2>조별 진행 <small>카드 선택 시 분류판 · 설계안 · 부작용</small></h2>
    <div class="teamgrid" id="teams"></div>
  </section>
</main>

<dialog id="detail">
  <div class="dhead"><h2 id="dTitle"></h2><button class="btn ghost" id="dClose">닫기</button></div>
  <div class="dbody vdetail">
    <div><h4>분류판</h4><div class="plane mini" id="dPlane"></div></div>
    <div><h4>설계안</h4><div class="dview" id="dDesign"></div><h4>받은 부작용 · 대응책</h4><div id="dSides"></div></div>
  </div>
</dialog>

<script type="module" src="js/board.js"></script>
</body>
</html>
