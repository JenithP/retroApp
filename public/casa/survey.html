<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>설문 옮겨 적기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* 종이 설문 조건의 옮겨 적기 — 1부 튜터링 화면과 닮지 않게 평범한 흰 양식으로 둔다 */
  :root { color-scheme: light; --ink: #222; --soft: #6b6b6b; --line: #dedede; --pick: #1f5fbf; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: "Noto Sans KR", system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .lead { color: var(--soft); font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
  label.num { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
  input[type=text] { font-family: inherit; font-size: 20px; width: 120px; padding: 8px 10px; border: 1px solid #bbb; border-radius: 6px; }
  .btn { font-family: inherit; font-weight: 500; font-size: 16px; padding: 12px 20px; border-radius: 8px; border: 0; background: var(--pick); color: #fff; cursor: pointer; }
  .btn[disabled] { background: #b9c6dc; cursor: default; }
  .msg { min-height: 1.5em; font-size: 14px; margin: 10px 0; color: #b3261e; }
  .msg.ok { color: #1e7a3a; }
  h2 { font-size: 15px; margin: 28px 0 4px; padding-top: 14px; border-top: 2px solid var(--ink); }
  .item { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .item p { margin: 0 0 8px; font-size: 15px; }
  .item p b { font-size: 13px; color: var(--soft); font-weight: 500; margin-right: 6px; }
  .scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .scale label { position: relative; }
  .scale input { position: absolute; opacity: 0; inset: 0; }
  .scale span { display: block; text-align: center; padding: 9px 0; border: 1px solid #c9c9c9; border-radius: 6px; font-size: 14px; }
  .scale input:checked + span { background: var(--pick); border-color: var(--pick); color: #fff; }
  .scale input:focus-visible + span { outline: 2px solid var(--pick); outline-offset: 2px; }
  .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--soft); margin-top: 4px; }
  .bar { position: sticky; bottom: 0; background: #fff; padding: 12px 0; border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
  .bar .count { font-size: 14px; color: var(--soft); }
  .demo { background: #333; color: #fff; text-align: center; font-size: 12px; padding: 4px; }
</style>
</head>
<body>
<main>
  <h1>설문 옮겨 적기</h1>
  <p class="lead">종이 설문지에 적은 숫자를 그대로 옮겨 적어 주십시오. 새로 답하는 것이 아니라 옮겨 적는 것입니다.</p>

  <section id="step1">
    <label class="num" for="num">프린트물 표지의 번호</label>
    <input type="text" id="num" inputmode="numeric" maxlength="3" autocomplete="off">
    <button class="btn" id="ok" type="button">확인</button>
    <div class="msg" id="msg1" role="alert"></div>
  </section>

  <section id="step2" hidden>
    <div id="items"></div>
    <div class="bar">
      <button class="btn" id="send" type="button" disabled>보내기</button>
      <span class="count" id="count"></span>
    </div>
    <div class="msg" id="msg2" role="alert"></div>
  </section>

  <section id="done" hidden>
    <p class="msg ok">옮겨 적기가 끝났습니다. 설문지는 걷어 갈 때 제출해 주십시오.</p>
  </section>
</main>
<script type="module">
import { SURVEY, SURVEY_SCALE, NUMBER_MAX, condOf } from "./js/data.js";
import { ready, savePaperSurvey, isDemoMode } from "./js/fb.js";

if (isDemoMode) document.body.insertAdjacentHTML("afterbegin", '<div class="demo">미리보기 — 기록이 남지 않습니다</div>');

const $ = id => document.getElementById(id);
let n = null;
const answers = {};

// 종이 설문지와 같은 순서 · 같은 묶음
const groups = [
  ["튜터링 세션", SURVEY.filter(s => s.part === "tutor")],
  ["평가 세션", SURVEY.filter(s => s.part === "eval")],
  ["마지막 문항", SURVEY.filter(s => s.part === "belief")],
];
let k = 0;
$("items").innerHTML = groups.map(([name, list]) => `<h2>${name}</h2>` + list.map(it => {
  k += 1;
  const lo = it.lo || SURVEY_SCALE.lo, hi = it.hi || SURVEY_SCALE.hi;
  return `<div class="item"><p><b>${k}</b>${it.q}</p>
    <div class="scale" role="radiogroup" aria-label="${k}번">${Array.from({ length: 10 }, (_, i) =>
      `<label><input type="radio" name="${it.id}" value="${i + 1}"><span>${i + 1}</span></label>`).join("")}</div>
    <div class="ends"><span>1 ${lo}</span><span>${hi} 10</span></div></div>`;
}).join("")).join("");

const total = SURVEY.length;
const refresh = () => {
  const c = Object.keys(answers).length;
  $("count").textContent = `${c} / ${total}`;
  $("send").disabled = c < total;
};
$("items").addEventListener("change", e => { answers[e.target.name] = Number(e.target.value); refresh(); });

$("ok").onclick = () => {
  const v = Number($("num").value.trim());
  if (!Number.isInteger(v) || v < 1 || v > NUMBER_MAX) { $("msg1").textContent = `1부터 ${NUMBER_MAX} 사이의 번호를 입력하십시오.`; return; }
  if (condOf(v) !== "paper") { $("msg1").textContent = "이 번호는 옮겨 적기 대상이 아닙니다. 번호를 다시 확인해 주십시오."; return; }
  n = v; $("msg1").textContent = "";
  $("step1").hidden = true; $("step2").hidden = false;
  refresh();
};
$("num").onkeydown = e => { if (e.key === "Enter") $("ok").click(); };

$("send").onclick = async () => {
  $("send").disabled = true; $("msg2").textContent = "보내는 중…";
  try {
    await ready();
    await savePaperSurvey(n, answers);
    $("step2").hidden = true; $("done").hidden = false;
  } catch (e) {
    console.error(e);
    $("send").disabled = false;
    $("msg2").textContent = e.code === "permission-denied" || e.code === "not-found"
      ? "이 번호로는 보낼 수 없습니다. 노트북에서 세션을 끝냈는지, 이미 보내지 않았는지 확인해 주십시오."
      : "보내지 못했습니다. 잠시 후 다시 눌러 주십시오.";
  }
};
</script>
</body>
</html>
