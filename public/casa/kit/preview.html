<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장치 X-9 · 기본형</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="x9.css">
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 16px; box-sizing: border-box; font-family: "Noto Sans KR", system-ui, sans-serif; color: #3c3933;
    background: radial-gradient(120% 90% at 50% 20%, #f6f3ee 0%, #e4dfd6 60%, #d6d0c5 100%);
  }
  .wrap { width: min(640px, 100%); }
  h1 { font-size: 15px; font-weight: 700; letter-spacing: .08em; margin: 0 0 4px; }
  p { font-size: 13px; color: #6f6a60; margin: 0 0 28px; line-height: 1.6; }
  .log { margin-top: 36px; font-size: 12px; color: #8a8478; min-height: 1.4em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>장치 X-9 · 기본형</h1>
  <p>다이얼로 시간을 고르고 버튼을 누르십시오. 단서가 하나도 붙지 않은 상태입니다.</p>
  <div id="device"></div>
  <div class="log" id="log"></div>
</div>
<script type="module">
import { mount } from "./x9.js";
const speed = Number(new URLSearchParams(location.search).get("speed")) || 1;
const dev = mount(document.getElementById("device"), { minutes: 5, speed });
const log = document.getElementById("log");
["dial", "start", "pause", "resume", "end", "clear"].forEach(n => dev.on(n, d => { log.textContent = `${n}${d !== undefined ? " · " + d : ""}`; }));
</script>
</body>
</html>
